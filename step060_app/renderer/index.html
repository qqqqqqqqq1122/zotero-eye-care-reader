<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" style="--sidebar-width: 240px; --split-view-size: 50%; --bottom-placeholder-height: 50px; --toolbar-placeholder-width: 0px">
<head>
	<meta charset="UTF-8">
	<title>PDF 阅读器</title>
	<link rel="stylesheet" href="/reader.css">
</head>
<!--
	注意：脚本必须放在 </body> 之前，不能放 <head>。
	reader.js 在模块求值时会执行 window.getComputedStyle(document.body)，
	放在 head 里时 document.body 还是 null，会直接抛 TypeError 导致
	window.createReader 根本没机会挂上。
	（Zotero 自己的 index.reader.html 模板里也没有 script 标签 ——
	  是 HtmlWebpackPlugin 把脚本注入到 body 末尾的。）
-->
<body class="sidebar-open">
	<div id="reader-ui"></div>
	<div id="split-view">
		<div id="primary-view" class="primary-view"></div>
		<div id="secondary-view" class="secondary-view"></div>
	</div>
	<div id="printContainer"></div>
	<script src="/eye-care-themes.js"></script>
	<script src="/reader.js"></script>
	<script src="/app.js"></script>
</body>
</html>
