<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" style="--sidebar-width: 240px; --split-view-size: 50%; --bottom-placeholder-height: 50px; --toolbar-placeholder-width: 0px">
<head>
	<meta charset="UTF-8">
	<title>PDF 阅读器</title>
	<link rel="stylesheet" href="/reader.css">
	<style>
		/*
			选中弹窗：停靠到窗口右侧空白处，不再盖在正文上。

			必须用 !important：ViewPopup 是用内联 style 的 transform 定位的
			（src/common/components/view-popup/common/view-popup.js:167），
			而不带 !important 的内联样式会被带 !important 的样式表规则压过。

			竖直居中用 translate 属性而不是 transform ——
			因为上面已经把 transform 强制成 none 了，两者是独立的 CSS 属性。
		*/
		.view-popup.selection-popup {
			position: fixed !important;
			transform: none !important;
			translate: 0 -50% !important;
			top: 50% !important;
			bottom: auto !important;
			right: 10px !important;
			left: auto !important;
			margin: 0 !important;
			z-index: 100 !important;
		}

		/* 关掉选中弹窗时（右键菜单里切换）彻底不渲染 */
		body.zr-hide-selection-popup .view-popup.selection-popup {
			display: none !important;
		}
	</style>
</head>
<!--
	注意：脚本必须放在 </body> 之前，不能放 <head>。
	reader.js 在模块求值时会执行 window.getComputedStyle(document.body)，
	放在 head 里时 document.body 还是 null，会直接抛 TypeError 导致
	window.createReader 根本没机会挂上。
	（Zotero 自己的 index.reader.html 模板里也没有 script 标签 ——
	  是 HtmlWebpackPlugin 把脚本注入到 body 末尾的。）
-->
<body class="sidebar-open">
	<div id="reader-ui"></div>
	<div id="split-view">
		<div id="primary-view" class="primary-view"></div>
		<div id="secondary-view" class="secondary-view"></div>
	</div>
	<div id="printContainer"></div>
	<script src="/eye-care-themes.js"></script>
	<script src="/reader.js"></script>
	<script src="/app.js"></script>
</body>
</html>
