<!DOCTYPE html>
<html lang="zh-CN" dir="ltr" style="--sidebar-width: 240px; --split-view-size: 50%; --bottom-placeholder-height: 50px; --toolbar-placeholder-width: 0px">
<head>
	<meta charset="UTF-8">
	<title>PDF 阅读器</title>
	<link rel="stylesheet" href="/reader.css">
	<style>
		/*
			选中弹窗：停靠到窗口右侧空白处，不再盖在正文上。

			必须用 !important：ViewPopup 是用内联 style 的 transform 定位的
			（src/common/components/view-popup/common/view-popup.js:167），
			而不带 !important 的内联样式会被带 !important 的样式表规则压过。

			竖直居中用 translate 属性而不是 transform ——
			因为上面已经把 transform 强制成 none 了，两者是独立的 CSS 属性。
		*/
		.view-popup.selection-popup {
			position: fixed !important;
			transform: none !important;
			translate: 0 -50% !important;
			top: 50% !important;
			bottom: auto !important;
			right: 10px !important;
			left: auto !important;
			margin: 0 !important;
			z-index: 100 !important;
		}

		/* 关掉选中弹窗时（右键菜单里切换）彻底不渲染 */
		body.zr-hide-selection-popup .view-popup.selection-popup {
			display: none !important;
		}

		/* ---------- 启动页：打开历史 ---------- */
		body.zr-start-screen {
			margin: 0;
			overflow: auto;
			background: #1c1c1e;
		}
		body.zr-start-screen #reader-ui,
		body.zr-start-screen #split-view,
		body.zr-start-screen #printContainer {
			display: none !important;
		}
		.zr-start {
			min-height: 100vh;
			box-sizing: border-box;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 48px 24px;
			background: radial-gradient(1200px 600px at 50% -10%, #2b2b30 0%, #1c1c1e 55%);
			color: #eaeaec;
			font: 14px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
		}
		.zr-start, .zr-start * {
			box-sizing: border-box;
		}
		.zr-start-card {
			width: 100%;
			max-width: 720px;
		}
		.zr-start-card h1 {
			margin: 0 0 20px;
			font-size: 26px;
			font-weight: 600;
			letter-spacing: .3px;
		}
		.zr-open-btn {
			width: 100%;
			padding: 13px 18px;
			border: 1px solid #3d7eff;
			border-radius: 10px;
			background: #2f6fe4;
			color: #fff;
			font: inherit;
			font-size: 15px;
			cursor: pointer;
			transition: background .15s;
		}
		.zr-open-btn:hover { background: #3d7eff; }
		.zr-open-btn:disabled { opacity: .6; cursor: default; }
		.zr-status {
			min-height: 20px;
			margin: 8px 2px 0;
			color: #ff8a8a;
			font-size: 13px;
		}
		.zr-status.zr-status-ok { color: #8fd19e; }
		.zr-recent-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin: 22px 2px 10px;
			color: #9a9aa2;
			font-size: 13px;
		}
		.zr-clear-btn {
			border: 0;
			background: none;
			color: #9a9aa2;
			font: inherit;
			font-size: 12px;
			cursor: pointer;
			padding: 4px 6px;
			border-radius: 6px;
		}
		.zr-clear-btn:hover { color: #fff; background: #333338; }
		.zr-clear-btn:disabled { opacity: .4; cursor: default; }
		.zr-recent-list {
			list-style: none;
			margin: 0;
			padding: 0;
			max-height: 52vh;
			overflow-y: auto;
		}
		.zr-recent-item {
			display: flex;
			align-items: center;
			gap: 10px;
			border-radius: 10px;
			margin-bottom: 6px;
			background: #26262b;
			border: 1px solid #303036;
		}
		.zr-recent-item:hover { background: #2d2d33; border-color: #3a3a42; }
		.zr-recent-open {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 3px;
			padding: 12px 14px;
			border: 0;
			background: none;
			color: inherit;
			font: inherit;
			text-align: left;
			cursor: pointer;
			border-radius: 10px;
		}
		.zr-recent-open:disabled { cursor: default; }
		.zr-recent-name {
			max-width: 100%;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-size: 14px;
			color: #f0f0f2;
		}
		.zr-recent-dir {
			max-width: 100%;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-size: 12px;
			color: #8b8b94;
		}
		.zr-recent-missing .zr-recent-name { color: #77777f; }
		.zr-recent-missing .zr-recent-dir { color: #b06a6a; }
		.zr-recent-time {
			color: #85858e;
			font-size: 12px;
			white-space: nowrap;
		}
		.zr-recent-remove {
			border: 0;
			background: none;
			color: #6f6f78;
			font-size: 18px;
			line-height: 1;
			padding: 8px 12px;
			margin-right: 2px;
			cursor: pointer;
			border-radius: 8px;
		}
		.zr-recent-remove:hover { color: #fff; background: #3a3a42; }
		.zr-recent-empty {
			color: #85858e;
			font-size: 13px;
			padding: 18px 4px;
		}
		.zr-start-hint {
			margin-top: 22px;
			color: #6f6f78;
			font-size: 12px;
		}

		/* 历史条目右键菜单 */
		.zr-ctx-menu {
			position: fixed;
			z-index: 9999;
			min-width: 210px;
			padding: 6px;
			border: 1px solid #3a3a42;
			border-radius: 10px;
			background: #2a2a30;
			box-shadow: 0 10px 32px rgba(0, 0, 0, .45);
			color: #e8e8ea;
			font: 13px/1.4 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
		}
		.zr-ctx-menu button {
			display: block;
			width: 100%;
			padding: 8px 10px;
			border: 0;
			border-radius: 6px;
			background: none;
			color: inherit;
			font: inherit;
			text-align: left;
			cursor: pointer;
		}
		.zr-ctx-menu button:hover:not(:disabled) { background: #3a3a42; }
		.zr-ctx-menu button:disabled { color: #6f6f78; cursor: default; }
		.zr-ctx-sep {
			height: 1px;
			margin: 5px 8px;
			background: #3a3a42;
		}
	</style>
</head>
<!--
	注意：脚本必须放在 </body> 之前，不能放 <head>。
	reader.js 在模块求值时会执行 window.getComputedStyle(document.body)，
	放在 head 里时 document.body 还是 null，会直接抛 TypeError 导致
	window.createReader 根本没机会挂上。
	（Zotero 自己的 index.reader.html 模板里也没有 script 标签 ——
	  是 HtmlWebpackPlugin 把脚本注入到 body 末尾的。）
-->
<body class="sidebar-open">
	<div id="reader-ui"></div>
	<div id="split-view">
		<div id="primary-view" class="primary-view"></div>
		<div id="secondary-view" class="secondary-view"></div>
	</div>
	<div id="printContainer"></div>
	<script src="/eye-care-themes.js"></script>
	<script src="/reader.js"></script>
	<script src="/app.js"></script>
</body>
</html>
